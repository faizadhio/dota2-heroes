name: Probe dota2.com datafeed (temporary)
on:
  push:
    branches: [claude/project-thread-ujzb8t]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" "https://www.dota2.com/datafeed/herodata?language=english&hero_id=102" -o h.json -w "herodata %{http_code}\n"
          curl -s -I "https://www.dota2.com/datafeed/herodata?language=english&hero_id=102" -H "Origin: https://faizadhio.github.io" | grep -i -E "access-control|content-type|HTTP" || true
          jq -c '.result.data.heroes[0] | with_entries(select(.value|type!="array" and type!="object"))' h.json | cut -c1-4000
          jq -c '.result.data.heroes[0] | to_entries[] | select(.value|type=="array" or type=="object") | {k:.key,n:(.value|length)}' h.json
          jq -c '.result.data.heroes[0].abilities[] | {id,name,name_loc,ability_is_granted_by_shard,ability_is_granted_by_scepter,ability_is_innate, type, behavior}' h.json
          jq -c '.result.data.heroes[0].abilities[0]' h.json | cut -c1-3000
          jq -c '.result.data.heroes[0].facets' h.json | cut -c1-1500
          jq -c '.result.data.heroes[0].talents' h.json | cut -c1-1200
          curl -s -A "Mozilla/5.0" "https://www.dota2.com/datafeed/herolist?language=english" -o l.json -w "herolist %{http_code}\n"
          jq -c '.result.data.heroes | length, .[0]' l.json
