name: Probe upgrade videos (temporary)
on:
  push:
    branches: [claude/project-thread-ujzb8t]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0" https://www.dota2.com/hero/outworlddestroyer -o page.html
          grep -o '<script[^>]*src="[^"]*"' page.html | head -20
          for s in $(grep -o 'src="[^"]*\.js[^"]*"' page.html | sed 's/src="//;s/"$//' | sed 's/&amp;/\&/g'); do
            case "$s" in http*) u="$s";; //*) u="https:$s";; *) u="https://www.dota2.com$s";; esac
            curl -s -A "Mozilla/5.0" "$u" -o "b_$(echo $u | md5sum | cut -c1-6).js"
          done
          ls -la b_*.js
          python3 - <<'PY'
          import glob, re
          for f in glob.glob('b_*.js'):
              t = open(f, encoding='utf-8', errors='ignore').read()
              for m in re.finditer(r'VIDEO_URL\}abilities', t):
                  print('=====', f, m.start())
                  print(t[max(0, m.start()-3500):m.start()+3000])
              for m in re.finditer(r'VIDEO_URL\s*[:=]', t):
                  print('-- VIDEO_URL def', t[m.start()-100:m.start()+250])
          PY
