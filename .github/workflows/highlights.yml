name: Refresh tournament highlights

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shares the group with the data snapshot so the two never push at the same time.
concurrency: snapshot

jobs:
  highlights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/highlights.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commit the new highlights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/highlights.json ] || { echo "Nothing fetched"; exit 0; }
          git add data/highlights.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh tournament highlights"
          git push
